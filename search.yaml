search_term: >-
  ("data analyst" OR "data scientist" OR "business intelligence analyst"
  OR "analytics consultant" OR "operations analyst" OR "supply chain analyst"
  OR "logistics analyst" OR "logistics engineer" OR "logistic engineer"
  OR "supply chain engineer" OR "operations research" OR "operational research"
  OR "simulation consultant" OR "simulation engineer"
  OR "optimization engineer" OR "optimisation engineer"
  OR "process mining" OR "process intelligence" OR "process analyst"
  OR "industrial engineer" OR "demand planner" OR "production planner"
  OR "inventory analyst" OR "capacity planner" OR "data consultant"
  OR "supply chain consultant" OR "business analyst"
  OR "machine learning engineer" OR "research software engineer"
  OR "simulation developer")
# The same keyword query and filters apply to every location.
locations:
  - "Netherlands"
  - "Oslo, Norway"
  - "Berlin, Germany"
  - "Munich, Germany"
  - "Gothenburg, Sweden"  # Göteborg.
  - "Stockholm, Sweden"
  - "Copenhagen, Denmark"
  - "Paris, France"
distance: null
hours_old: 4
offset: 0
results_wanted: 1000  # Maximum discovered IDs per location per run.
batch_size: 10
request_delay_seconds: 5

# A new tab in your existing spreadsheet, with the six requested fields first.
sheet_name: "Jobs_Languages"
# Reuse old descriptions while reclassifying the broader language requirements.
copy_cached_from: "Jobs_AI"

# Check the full description before spending LLM tokens.
language_gate:
  enabled: true
  reject_languages: ["nl"]
  minimum_score: 0.90  # A detector score, not a guaranteed accuracy percentage.
  minimum_letters: 200  # Short or uncertain descriptions still go to the LLM.

llm:
  model: "gpt-6-luna"
  reasoning_effort: "none"
  max_output_tokens: 512
