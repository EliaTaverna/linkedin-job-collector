# Boolean keywords sent to LinkedIn. Edit these to match your search.
search_term: >-
  ("data analyst" OR "operations analyst" OR "supply chain analyst")
location: "Netherlands"
distance: null

# Search the previous seven hours on each run.
hours_old: 7
offset: 0

# Overall search ceiling; this is NOT the batch size.
results_wanted: 1000

# Save IDs, filter titles, download eligible descriptions, then fetch another batch.
batch_size: 10  # Change to 20 if you prefer.
min_english_likelihood_title: 0.50

# Minimum spacing between LinkedIn request starts, not a guaranteed safe rate.
request_delay_seconds: 5
