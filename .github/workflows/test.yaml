name: LinkedIn Job Collector

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'all: search and classify; descriptions: retry saved jobs only'
        type: choice
        required: true
        default: all
        options:
          - all
          - descriptions

  schedule:
    - cron: '0 */3 * * *'
      timezone: 'UTC'

permissions:
  contents: read

concurrency:
  group: linkedin-job-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install python-jobspy==1.4.1 gspread requests langdetect==1.0.9 PyYAML==6.0.3

      - name: Run collector
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COLLECTOR_MODE: ${{ inputs.mode || 'all' }}
        run: python -u main.py
