name: Test Python

on:
  workflow_dispatch:

  schedule:
    - cron: '0 0 * * *'
      timezone: 'Europe/Rome'

permissions:
  contents: read

# Prevent two runs from updating the sheet simultaneously
concurrency:
  group: linkedin-job-collector
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install python-jobspy==1.4.1 gspread langdetect==1.0.9 PyYAML==6.0.3

      - name: Run our Python file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
        run: python main.py
