# Before calling the LLM, require at least one of these terms in the description.
# Matching is case-insensitive and uses whole-word boundaries.
# Spaces in phrases also match hyphens, including Unicode hyphens.
# All entries below are alternatives (OR); no match from each group is required.
# A role can qualify through software, quantitative work, industrial methods,
# or logistics/planning methods. Programming is not mandatory.
enabled: true
all_of: []
any_of:
  # Programming and scripting.
  - "Python"
  - "Programming"
  - "Coding"
  - "Scripting"
  - "Programmer"
  - "Software development"
  - "MATLAB"
  - "R programming"  # Avoid matching R&D through a standalone R.
  - "RStudio"
  - "VBA"

